# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # build-plugin's internal setup-node has no cache input, so its npm ci
      # pulled every package from the registry on each release. This earlier
      # setup-node restores ~/.npm (keyed on package-lock.json) for it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: grafana/plugin-actions/build-plugin@8b12a2d6fa5fc0939a6bf75905453d4b505ef29a # build-plugin/v1.2.0
        with:
          # build-plugin defaults to Node 20 and Go 1.25; match the CI build
          # (Node 22). Go tracks the 1.26 line so a renovate bump of the go.mod
          # directive cannot outrun a pinned patch toolchain again.
          node-version: '22'
          go-version: '1.26'
          # To sign for the catalog / Grafana Cloud, save the token in repository
          # secrets and uncomment (see the grafana.com plugin-tools signing docs):
          # policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
